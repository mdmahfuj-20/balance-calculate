<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance Calculate</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
    color:#111827;
}

.container{
    max-width:480px;
    margin:auto;
    padding:20px;
}

.logo{
    width:75px;
    height:75px;
    border-radius:22px;
    margin:10px auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ffd54a,#f59e0b);
    font-size:40px;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:16px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:1px solid #d1d5db;
    border-radius:11px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:9px;
    border:0;
    border-radius:11px;
    background:#111827;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button.secondary{
    background:#e5e7eb;
    color:#111827;
}

.hidden{
    display:none;
}

.message{
    text-align:center;
    color:#dc2626;
    margin-top:12px;
    font-size:14px;
}

.balance{
    text-align:center;
    font-size:35px;
    font-weight:bold;
    color:#b77900;
    margin:15px 0;
}

.email{
    text-align:center;
    color:#6b7280;
    font-size:14px;
}

.package{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:1px solid #e5e7eb;
    border-radius:13px;
    padding:12px;
    margin:10px 0;
}

.package button{
    width:auto;
    margin:0;
    padding:9px 14px;
}

.coins{
    font-weight:bold;
}

.price{
    color:#b77900;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
🪙
</div>

<h1>Balance Calculate</h1>

<div class="subtitle">
Gold Coins & Balance
</div>


<!-- REGISTER / LOGIN -->

<div id="authBox" class="card">

<h2>Create Account</h2>

<input
id="name"
type="text"
placeholder="Your Name"
>

<input
id="email"
type="email"
placeholder="Email"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button id="registerButton">
Create Account
</button>

<button
id="loginButton"
class="secondary"
>
Login
</button>

<div id="authMessage" class="message"></div>

</div>


<!-- USER ACCOUNT -->

<div id="accountBox" class="hidden">

<div class="card">

<h2>My Account</h2>

<div id="userEmail" class="email">
</div>

<div
id="coinBalance"
class="balance"
>
0 🪙
</div>

<button
id="logoutButton"
class="secondary"
>
Logout
</button>

</div>


<!-- COIN SHOP -->

<div class="card">

<h2>Gold Coin Shop</h2>


<div class="package">

<span class="coins">
100 🪙
</span>

<span class="price">
$1.00
</span>

<button
onclick="buyCoins(100,1.00)"
>
Buy
</button>

</div>


<div class="package">

<span class="coins">
100 🪙
</span>

<span class="price">
$1.01
</span>

<button
onclick="buyCoins(100,1.01)"
>
Buy
</button>

</div>


<div class="package">

<span class="coins">
200 🪙
</span>

<span class="price">
$2.00
</span>

<button
onclick="buyCoins(200,2.00)"
>
Buy
</button>

</div>


<div class="package">

<span class="coins">
200 🪙
</span>

<span class="price">
$2.01
</span>

<button
onclick="buyCoins(200,2.01)"
>
Buy
</button>

</div>


<div class="package">

<span class="coins">
300 🪙
</span>

<span class="price">
$3.00
</span>

<button
onclick="buyCoins(300,3.00)"
>
Buy
</button>

</div>


<div class="package">

<span class="coins">
300 🪙
</span>

<span class="price">
$3.01
</span>

<button
onclick="buyCoins(300,3.01)"
>
Buy
</button>

</div>


<div class="package">

<span class="coins">
400 🪙
</span>

<span class="price">
$4.00
</span>

<button
onclick="buyCoins(400,4.00)"
>
Buy
</button>

</div>


<div class="package">

<span class="coins">
400 🪙
</span>

<span class="price">
$4.01
</span>

<button
onclick="buyCoins(400,4.01)"
>
Buy
</button>

</div>


<div class="package">

<span class="coins">
500 🪙
</span>

<span class="price">
$5.00
</span>

<button
onclick="buyCoins(500,5.00)"
>
Buy
</button>

</div>


<div class="package">

<span class="coins">
500 🪙
</span>

<span class="price">
$5.01
</span>

<button
onclick="buyCoins(500,5.01)"
>
Buy
</button>

</div>

<div
id="purchaseMessage"
class="message"
>
</div>

</div>

</div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged,
updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getDatabase,
ref,
set,
onValue
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:
"AIzaSyAYnd7gn6gbYui1IEPDb67jEjADyuoTCsM",

authDomain:
"balance-calculate.firebaseapp.com",

databaseURL:
"https://balance-calculate-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"balance-calculate",

storageBucket:
"balance-calculate.firebasestorage.app",

messagingSenderId:
"446481480493",

appId:
"1:446481480493:web:042e1659a3c28486e771a4",

measurementId:
"G-DHJTN34J3M"

};


/* INITIALIZE FIREBASE */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const database =
getDatabase(app);


/* REGISTER */

document
.getElementById("registerButton")
.onclick =
async function(){

const name =
document
.getElementById("name")
.value
.trim();

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const message =
document
.getElementById("authMessage");

message.innerText="";


if(name===""){

message.innerText=
"Please enter your name.";

return;

}


if(password.length<6){

message.innerText=
"Password must be at least 6 characters.";

return;

}


try{

const userCredential =
await
createUserWithEmailAndPassword(
auth,
email,
password
);

const user =
userCredential.user;


await updateProfile(
user,
{
displayName:name
}
);


/* CREATE USER DATABASE */

await set(

ref(
database,
"users/"+user.uid
),

{

name:name,

email:email,

coins:0,

createdAt:
Date.now()

}

);


alert(
"Account created successfully!"
);


}catch(error){

message.innerText=
error.message;

}

};


/* LOGIN */

document
.getElementById("loginButton")
.onclick =
async function(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const message =
document
.getElementById("authMessage");


try{

await
signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

message.innerText=
error.message;

}

};


/* LOGOUT */

document
.getElementById("logoutButton")
.onclick =
async function(){

await signOut(auth);

};


/* AUTH STATE */

onAuthStateChanged(
auth,
function(user){

if(user){

document
.getElementById("authBox")
.classList
.add("hidden");


document
.getElementById("accountBox")
.classList
.remove("hidden");


document
.getElementById("userEmail")
.innerText=
user.email;


/* READ COINS */

const coinRef =
ref(
database,
"users/"+user.uid+"/coins"
);


onValue(
coinRef,
function(snapshot){

const coins =
snapshot.val() || 0;


document
.getElementById("coinBalance")
.innerText=
coins+" 🪙";

}
);


}else{

document
.getElementById("authBox")
.classList
.remove("hidden");


document
.getElementById("accountBox")
.classList
.add("hidden");

}

});


/* BUY BUTTON */

window.buyCoins =
function(coins,price){

const message =
document
.getElementById("purchaseMessage");


message.innerText=
"You selected "+
coins+
" Gold Coins for $"+
price.toFixed(2)+
". Payment system will be connected next.";

};

</script>

</body>
</html>
